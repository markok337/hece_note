name: keepalive

# Supabase 무료 프로젝트는 7일간 요청이 없으면 일시정지된다. 사흘마다 가벼운 요청을 보낸다.
# 또 GitHub 은 공개 저장소에 60일 동안 커밋 같은 활동이 없으면 예약 실행을 꺼 버린다.
# 그러면 이 워크플로가 멈추고 Supabase 도 곧 정지되므로, 마지막 커밋이 오래됐을 때 빈 커밋을 하나 남긴다.
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase DB 조회
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_KEY}" ]; then
            echo "::error::시크릿 VITE_SUPABASE_URL 또는 VITE_SUPABASE_PUBLISHABLE_KEY 가 비어 있다."
            exit 1
          fi
          # 앱(src/supabase.ts)처럼, 대시보드에서 /rest/v1/ 까지 복사한 주소도 프로젝트 루트 주소로 맞춘다.
          BASE="${SUPABASE_URL%/}"
          BASE="${BASE%/rest/v1}"
          # 실패 원인을 로그에서 알 수 있도록 상태 코드를 찍는다(주소와 키는 찍지 않는다).
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            "${BASE}/rest/v1/device_pings?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}") || true
          echo "HTTP ${STATUS}"
          if [ "${STATUS}" != "200" ]; then
            echo "::error::Supabase 조회가 실패했다(HTTP ${STATUS}). 401·403 은 키, 404 는 주소나 device_pings 테이블을 확인한다."
            exit 1
          fi

      # 핑이 실패해도 실행해서 예약 실행이 꺼지지 않게 한다. 사흘마다 커밋하면 기록이 지저분해지므로 45일 넘게 지났을 때만 한다.
      # GITHUB_TOKEN 으로 올린 커밋은 다른 워크플로(배포)를 깨우지 않는다. [skip ci] 는 만약을 위한 표시다.
      - name: 저장소 활동 유지
        if: always()
        run: |
          LAST=$(git log -1 --format=%ct)
          AGE_DAYS=$(( ($(date +%s) - LAST) / 86400 ))
          echo "마지막 커밋으로부터 ${AGE_DAYS}일"
          if [ "${AGE_DAYS}" -lt 45 ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: 예약 실행이 꺼지지 않게 활동 기록을 남김 [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
