name: keepalive

# Supabase 무료 프로젝트는 7일간 요청이 없으면 일시정지된다. 사흘마다 가벼운 요청을 보낸다.
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase DB 조회
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error \
            "${SUPABASE_URL}/rest/v1/device_pings?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}"
